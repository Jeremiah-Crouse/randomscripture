<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Scripture Randomizer</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and ReactDOM CDNs -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
</head>
<body class="font-sans antialiased bg-gradient-to-br from-blue-100 to-purple-200 flex items-center justify-center min-h-screen p-4">

    <div id="root"></div>

    <script type="text/javascript">
        // Ensure the DOM is fully loaded before executing the React application code.
        document.addEventListener('DOMContentLoaded', () => {

            // The main App component logic
            const App = () => {
                // State to hold the displayed scripture text
                const [currentScriptureText, setCurrentScriptureText] = React.useState("Click 'Get Random Scripture' to begin!");
                // State to hold the scripture reference (e.g., "Genesis 1:1")
                const [currentScriptureReference, setCurrentScriptureReference] = React.useState("");
                // State for loading indicator
                const [isLoading, setIsLoading] = React.useState(false);
                // State for error messages
                const [error, setError] = React.useState(null);
                // State to track the mode of randomness (from server: 'bible-quantum', 'bible-pseudo', 'liber')
                const [randomnessMode, setRandomnessMode] = React.useState("N/A"); // Default or initial state
                // Removed buttonDisabled and countdown states, as cooldown is removed


                /**
                 * Fetches a random verse from the Node.js backend.
                 * The backend handles all the quantum random number generation,
                 * KJV data lookup, and Liber Legis fallback logic.
                 * @returns {Promise<Object>} A promise that resolves to an object containing verse details.
                 */
                const fetchRandomVerse = React.useCallback(async () => {
                    setIsLoading(true);
                    setError(null);
                    setCurrentScriptureText("Loading verse...");
                    setCurrentScriptureReference("");

                    try {
                        // Make a request to your Node.js backend's /get-verse endpoint
                        const response = await fetch('/get-verse');
                        if (!response.ok) {
                            // Attempt to read error message from response if available
                            const errorData = await response.json().catch(() => ({}));
                            const errorMessage = errorData.error || response.statusText || "Unknown server error.";
                            throw new Error(`Server error: ${errorMessage}`);
                        }
                        const data = await response.json(); // Parse the JSON response from the server

                        if (data.text) {
                            // Determine the reference format based on the mode returned by the server
                            let reference;
                            let modeText;
                            if (data.mode === 'liber') {
                                reference = `Liber Legis Chapter ${data.chapter}:${data.verse}`;
                                modeText = 'Liber Legis (Pseudo-random)';
                            } else { // 'bible-quantum' or 'bible-pseudo'
                                reference = `${data.book} ${data.chapter}:${data.verse} (KJV)`;
                                modeText = data.mode === 'bible-quantum' ? 'Quantum Randomness Used' : 'Pseudo-random Fallback Used';
                            }
                            setCurrentScriptureText(data.text);
                            setCurrentScriptureReference(`- ${reference}`);
                            setRandomnessMode(modeText);

                            // Cooldown logic is completely removed here.
                            // The button will always be clickable after loading.

                        } else {
                            throw new Error("No verse text received from server.");
                        }
                    } catch (err) {
                        console.error("Error fetching random verse:", err);
                        setError("Failed to load scripture: " + err.message);
                        setCurrentScriptureText("Failed to load scripture.");
                        setCurrentScriptureReference("");
                        setRandomnessMode("Error");
                    } finally {
                        setIsLoading(false);
                    }
                }, []);

                // Removed the useEffect for cooldown management entirely.

                // Function to handle the button click
                const handleGetRandomScripture = React.useCallback(async () => {
                    // Removed the `buttonDisabled` check, as there's no cooldown.
                    await fetchRandomVerse(); // Call the new fetch function
                }, [fetchRandomVerse]); // Dependency updated

                return (
                    React.createElement('div', { className: 'bg-white p-8 sm:p-12 rounded-2xl shadow-xl max-w-2xl w-full text-center border-t-4 border-blue-500' },
                        React.createElement('h1', { className: 'text-3xl sm:text-4xl font-extrabold text-gray-800 mb-6 leading-tight' },
                            'Quantum Scripture Randomizer'
                        ),
                        React.createElement('p', { className: 'text-gray-600 mb-8 text-lg' },
                            'Discover a random Bible verse using quantum randomness!'
                        ),
                        React.createElement('button', {
                            onClick: handleGetRandomScripture,
                            disabled: isLoading, // Only disable button if loading
                            className: `font-bold py-3 px-8 rounded-full transition duration-300 ease-in-out transform shadow-lg
                                ${isLoading ? 'bg-gray-400 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700 text-white hover:scale-105'}`
                        },
                            isLoading ? 'Fetching...' : 'Get Random Scripture'
                        ),

                        // Display Randomness Source status
                        React.createElement('div', { className: 'mt-4 text-sm text-gray-500' },
                            randomnessMode
                        ),

                        // Display the scripture text directly
                        React.createElement('div', { className: 'mt-10 p-6 bg-blue-50 bg-opacity-70 rounded-lg border border-blue-200 shadow-md min-h-[150px] flex flex-col justify-center items-center overflow-hidden' },
                            isLoading && (
                                React.createElement('div', { className: 'flex flex-col items-center' },
                                    React.createElement('div', { className: 'animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500' }),
                                    React.createElement('p', { className: 'ml-4 text-gray-700 mt-4 text-lg' }, 'Loading verse...')
                                )
                            ),
                            error && (
                                React.createElement('p', { className: 'text-red-600 text-lg' }, error)
                            ),
                            !isLoading && !error && (
                                React.createElement(React.Fragment, null,
                                    React.createElement('p', { id: 'scriptureText', className: 'text-gray-800 text-xl leading-relaxed mb-4' },
                                        currentScriptureText
                                    ),
                                    React.createElement('p', { id: 'scriptureReference', className: 'text-blue-700 font-semibold text-lg' },
                                        currentScriptureReference
                                    )
                                )
                            )
                        )
                    )
                );
            };

            // Render the React App component into the 'root' div using createRoot
            const container = document.getElementById('root');
            const root = ReactDOM.createRoot(container);
            root.render(React.createElement(App, null));
        });
    </script>
</body>
</html>
